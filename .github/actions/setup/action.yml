name: Setup
description: pnpm (the version in packageManager), Node 26 and the dependencies, as the lockfile pins them

runs:
  using: composite
  steps:
    # without `version`, it installs the one in package.json's packageManager
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Use Node.js 26
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
