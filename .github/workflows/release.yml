name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  # never interrupt a release halfway
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # the whole CI (lint, types, tests, builds) before anything leaves
  ci:
    uses: ./.github/workflows/ci.yml

  stage:
    name: Stage on npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the OIDC token of Trusted Publishing: no NPM_TOKEN
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: The tag is the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME doesn't match the version in package.json ($VERSION)"
            exit 1
          fi

      - name: Build the library
        run: pnpm build.types && pnpm build.lib

      # every file package.json points to (main, types, exports) goes in the package
      - name: The package has the library
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const pkg = require("./package.json");
            const packed = new Set(require(process.env.RUNNER_TEMP + "/pack.json")[0].files.map((file) => file.path));
            const entries = [pkg.main, pkg.qwik, pkg.types, ...Object.values(pkg.exports).flatMap(Object.values)];
            const files = new Set(entries.map((entry) => entry.replace(/^\.\//, "")));
            const missing = [...files].filter((file) => !packed.has(file));
            if (missing.length) {
              console.error(`::error::not in the package: ${missing.join(", ")}`);
              process.exit(1);
            }
          '

      # staged publishing needs npm 11.15 or later
      - name: Recent npm
        run: npm install -g npm@12

      # a prerelease (2.0.0-beta.0) goes under its identifier (`beta`), so a plain install keeps the stable line
      - name: npm dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
          else
            TAG=latest
          fi
          echo "$VERSION goes under '$TAG'"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # staged, not published: a maintainer approves it with 2FA (`npm stage approve`, see CONTRIBUTING.md)
      - name: Stage the version
        run: npm stage publish --access public --tag ${{ steps.dist-tag.outputs.tag }}

  github_release:
    name: GitHub release (draft)
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # the changelog compares this tag with the one before
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # a draft: publish it once the staged version is approved on npm
      - run: npx changelogithub@15.0.5 --draft ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
